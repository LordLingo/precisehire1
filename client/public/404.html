<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#0B1F3A" />
    <title>Page not found | Precise Hire</title>
    <meta name="description" content="That page was not found on Precise Hire." />
    <link rel="canonical" href="https://precisehire.com/404" />
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #FAF7F2;
        color: #0B1F3A;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 48px 20px;
      }
      .card {
        max-width: 680px;
        border: 1px solid rgba(11, 31, 58, 0.12);
        border-radius: 28px;
        background: #fff;
        padding: 48px;
        box-shadow: 0 24px 60px -28px rgba(11, 31, 58, 0.35);
        text-align: center;
      }
      .eyebrow {
        color: #B7232A;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      h1 { font-size: clamp(42px, 7vw, 72px); line-height: 1; margin: 14px 0; }
      p { color: rgba(11, 31, 58, 0.72); font-size: 18px; line-height: 1.6; }
      a {
        display: inline-flex;
        margin-top: 22px;
        padding: 14px 22px;
        border-radius: 999px;
        background: #B7232A;
        color: white;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <div class="eyebrow">404</div>
        <h1>We couldn't find that page.</h1>
        <p>The link may have moved or expired. Start from the homepage or explore Precise Hire's background check services.</p>
        <a href="/">Go to homepage</a>
      </section>
    </main>
  </body>
</html>
